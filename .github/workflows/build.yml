name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -e
          brew install ldid xz || true
          git clone --recursive --depth 1 -q https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "PATH=$HOME/theos/bin:$PATH" >> "$GITHUB_ENV"

      - name: Provide iOS SDK from Xcode
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK=$SDK ($VER)"
          mkdir -p "$HOME/theos/sdks"
          ln -sfn "$SDK" "$HOME/theos/sdks/iPhoneOS${VER}.sdk"
          ls -la "$HOME/theos/sdks"

      - name: Build both architectures
        run: |
          set -euo pipefail
          rm -rf /tmp/folderx-build-* packages
          mkdir -p packages
          for spec in "rootless arm64 iphoneos-arm64" "roothide arm64e iphoneos-arm64e"; do
            set -- $spec
            scheme="$1"; arch="$2"; pkgarch="$3"
            work="/tmp/folderx-build-$arch"
            rsync -a --exclude .theos --exclude packages ./ "$work/"
            cd "$work"
            sed -i.bak "s/^Architecture:.*/Architecture: $pkgarch/" control
            make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$scheme" ARCHS="$arch" 2>&1 | tail -200
            found=(packages/*.deb)
            [ -e "${found[0]}" ] || { echo "NO $arch DEB PRODUCED"; exit 1; }
            cp "${found[0]}" "$GITHUB_WORKSPACE/packages/"
            cd "$GITHUB_WORKSPACE"
          done

      - name: Inspect result
        run: |
          set -euo pipefail
          for f in packages/*.deb; do
            echo "--- $f"
            echo "SIZE=$(wc -c < "$f") SHA256=$(shasum -a 256 "$f" | cut -d' ' -f1)"
            ar t "$f"
          done
          test "$(find packages -name '*.deb' | wc -l | tr -d ' ')" = 2

      - uses: actions/upload-artifact@v4
        with:
          name: folderx-deb-both
          path: packages/*.deb
          if-no-files-found: error
